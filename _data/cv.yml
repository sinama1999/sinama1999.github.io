      - bullet: >-
          PhD researcher in biomedical engineering focused on machine learning for
          physiological time-series and multimodal clinical data. Experience developing
          data-driven models for cardiovascular health using ECG, PPG, and blood pressure
          waveforms. Strong background in Python, with publications in biomedical
          engineering venues.

